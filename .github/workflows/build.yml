name: Build Fabric 26.2 mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build and run core checks
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload installable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-route-cleaner-fabric-26.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
